    function LightboxModal({ imageSrc, title, subtitle, onClose }) {
      if (!imageSrc) return null;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (

                          <option>Real Estate & Brokerage</option>
                          <option>Other Operational Business</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Describe Your Current Workflow or Problem *
                      </label>
                      <textarea
                        required
                        rows="4"
                        value={message}
                        onChange={(e) => setMessage(e.target.value)}
                        placeholder="Tell Jose what you currently do (e.g. 15 workers on paper clipboards) and what features you want the app to have..."
                        className="w-full p-3 rounded-xl border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-blue-600 focus:outline-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={sending}
                      className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold uppercase tracking-wider shadow-md hover:shadow-blue-500/30 transition active:scale-98 shimmer-trigger disabled:opacity-50"
                    >
                      {sending ? 'Sending to Jose Rene Navarro...' : 'Send Inquiry to navarrojoserene.ca@gmail.com'}
                    </button>

                    <div className="text-[11px] text-center text-slate-500">
                      Inquiries route directly to Jose Rene Navarro at <span className="font-mono text-blue-600 font-bold">navarrojoserene.ca@gmail.com</span>
                    </div>
                  </form>
                )}
              </div>

            </div>

          </div>
        </section>
      );
